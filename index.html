<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antidystopia Polish // System Malfunction</title>
    <!-- Import Google Font for DotGothic16 -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030704; /* Matrix deep terminal black */
            color: #00ff66; /* Classic terminal phosphor green */
            font-family: 'DotGothic16', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Container Framework */
        .container {
            max-width: 700px;
            width: 100%;
            padding: 40px 20px;
            border: 1px dashed rgba(0, 255, 102, 0.2);
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(0, 255, 102, 0.05);
        }

        /* ==========================================================================
           HYPER-VIOLENT GLITCH ENGINE WITH NATURAL PAUSES
           ========================================================================== */
        h1 {
            font-size: 2.8rem;
            color: #00ff66;
            text-transform: lowercase;
            margin-bottom: 8px;
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
        }

        p {
            font-size: 1.4rem;
            color: #00aa44; /* Dimmer green profile for clear text hierarchy */
            text-transform: lowercase;
            letter-spacing: 4px;
            display: inline-block;
        }

        /* Terminal Cursor Animation Engine */
        p::after {
            content: '_';
            animation: cursorBlink 0.8s infinite;
        }

        .violent-glitch {
            position: relative;
            /* Animation running on a 2-second cycle to control the pause rhythm */
            animation: structuralCollapse 2s linear infinite; 
        }

        .violent-glitch::before,
        .violent-glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #030704;
            /* Pseudo-elements are hidden during the pause state to remove chromatic aberration */
            opacity: 0; 
        }

        /* Radical Red/Cyan color displacement layer channel */
        .violent-glitch::before {
            left: 4px;
            text-shadow: -3px 0 #ff0055, 0 1px #00ffff;
            animation: violentSlice1 2s steps(2) infinite alternate;
        }

        /* Deep Purple/Phosphor green secondary distortion layer channel */
        .violent-glitch::after {
            left: -4px;
            text-shadow: 3px 0 #bc8cff, 0 -2px #00ff66;
            animation: violentSlice2 2s steps(1) infinite reverse;
        }

        /* ==========================================================================
           ANIMATION KEYFRAMES (Compressed timeline mechanics)
           ========================================================================== */
        @keyframes structuralCollapse {
            /* 0% to 20%: Active Jitter Phase */
            0% { transform: translate(0) scaleY(1); filter: blur(0); }
            2% { transform: translate(-3px, 1px); }
            4% { transform: translate(4px, -1px); filter: hue-rotate(90deg); }
            6% { transform: translate(-1px, -2px); }
            8% { transform: translate(3px, 2px); }
            10% { transform: translate(-4px, -1px); filter: blur(0.5px); }
            12% { transform: translate(5px, 1px); }
            14% { transform: translate(-2px, 3px); }
            16% { transform: translate(2px, -1px); }
            18% { transform: translate(-5px, 2px); filter: drop-shadow(0 0 10px #00ff66); }
            /* 20% to 100%: Pure Static/Calm Pause Phase */
            20%, 100% { transform: translate(0) scaleY(1); filter: blur(0); }
        }

        @keyframes violentSlice1 {
            /* Synchronized to only show slices and color shifts during the active window */
            0% { opacity: 1; clip-path: inset(5% 0 85% 0); }
            4% { opacity: 1; clip-path: inset(45% 0 35% 0); }
            8% { opacity: 1; clip-path: inset(80% 0 2% 0); }
            12% { opacity: 1; clip-path: inset(12% 0 78% 0); }
            16% { opacity: 1; clip-path: inset(62% 0 10% 0); }
            19.9% { opacity: 1; clip-path: inset(25% 0 50% 0); }
            20%, 100% { opacity: 0; clip-path: inset(0 0 0 0); }
        }

        @keyframes violentSlice2 {
            0% { opacity: 1; clip-path: inset(88% 0 1% 0); }
            3% { opacity: 1; clip-path: inset(5% 0 90% 0); }
            6% { opacity: 1; clip-path: inset(33% 0 40% 0); }
            9% { opacity: 1; clip-path: inset(70% 0 15% 0); }
            12% { opacity: 1; clip-path: inset(18% 0 72% 0); }
            15% { opacity: 1; clip-path: inset(52% 0 30% 0); }
            18% { opacity: 1; clip-path: inset(95% 0 2% 0); }
            19.9% { opacity: 1; clip-path: inset(10% 0 82% 0); }
            20%, 100% { opacity: 0; clip-path: inset(0 0 0 0); }
        }

        @keyframes cursorBlink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* ==========================================================================
           📱 MOBILE RESPONSIVE ADAPTATION 
           ========================================================================== */
        @media (max-width: 550px) {
            .container {
                padding: 30px 15px;
                width: 95%;
            }
            h1 {
                font-size: 1.8rem;
                letter-spacing: 1px;
            }
            p {
                font-size: 1rem;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- The data-text for p must match the text inside exactly (without the dynamic CSS cursor) -->
        <h1 class="violent-glitch" data-text="antidystopia polish">antidystopia polish</h1>
        <br>
        <p class="violent-glitch" data-text="coming soon...">coming soon...</p>
    </div>

</body>
</html>
